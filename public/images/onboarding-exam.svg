<svg width="414" height="400" viewBox="0 0 414 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Large decorative circle -->
  <circle cx="207" cy="200" r="140" fill="#f3e8ff" opacity="0.6"/>
  <circle cx="207" cy="200" r="100" fill="#ede9fe" opacity="0.5"/>
  <!-- Person body -->
  <ellipse cx="207" cy="290" rx="45" ry="60" fill="#8b5cf6"/>
  <!-- Arms raised in celebration -->
  <line x1="175" y1="260" x2="130" y2="190" stroke="#8b5cf6" stroke-width="14" stroke-linecap="round"/>
  <line x1="239" y1="260" x2="284" y2="190" stroke="#8b5cf6" stroke-width="14" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="207" cy="170" r="38" fill="#d4a574"/>
  <!-- Hair -->
  <path d="M169 160c0-24 17-40 38-40s38 16 38 40c0 3-1 6-2 9 0-19-15-32-36-32s-36 13-36 32c-1-3-2-6-2-9z" fill="#2d1b4e"/>
  <!-- Happy eyes (closed arcs) -->
  <path d="M192 168c2-4 6-5 10-2" stroke="#2d1b4e" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M212 168c2-4 6-5 10-2" stroke="#2d1b4e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Big smile -->
  <path d="M195 182c5 8 16 10 24 4" stroke="#b8805a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Graduation cap -->
  <polygon points="207,125 160,145 207,158 254,145" fill="#6d28d9"/>
  <rect x="203" y="118" width="8" height="14" fill="#6d28d9"/>
  <line x1="250" y1="145" x2="250" y2="168" stroke="#6d28d9" stroke-width="2.5"/>
  <circle cx="250" cy="170" r="4" fill="#c4b5fd"/>
  <!-- Trophy (left hand) -->
  <rect x="112" y="170" width="30" height="25" rx="4" fill="#fbbf24"/>
  <rect x="120" y="165" width="14" height="10" rx="7" fill="#fbbf24"/>
  <rect x="118" y="195" width="20" height="6" rx="3" fill="#f59e0b"/>
  <rect x="115" y="199" width="26" height="4" rx="2" fill="#f59e0b"/>
  <!-- Certificate (right hand) -->
  <rect x="265" y="172" width="40" height="30" rx="4" fill="white"/>
  <line x1="272" y1="181" x2="298" y2="181" stroke="#ddd6fe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="272" y1="188" x2="293" y2="188" stroke="#ddd6fe" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="285" cy="196" r="4" fill="#fbbf24"/>
  <!-- Confetti / sparkles -->
  <rect x="120" y="100" width="8" height="3" rx="1.5" fill="#c4b5fd" transform="rotate(30 124 101.5)"/>
  <rect x="280" y="110" width="8" height="3" rx="1.5" fill="#a78bfa" transform="rotate(-20 284 111.5)"/>
  <rect x="150" y="80" width="8" height="3" rx="1.5" fill="#fbbf24" transform="rotate(15 154 81.5)"/>
  <rect x="250" y="85" width="8" height="3" rx="1.5" fill="#fbbf24" transform="rotate(-30 254 86.5)"/>
  <!-- Stars -->
  <path d="M100 130l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="#fbbf24"/>
  <path d="M310 120l4 8 9 1-6 6 2 9-8-4-8 4 2-9-6-6 9-1z" fill="#fbbf24"/>
  <path d="M340 200l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#c4b5fd"/>
  <!-- Floating circles -->
  <circle cx="80" cy="180" r="5" fill="#c4b5fd"/>
  <circle cx="340" cy="280" r="4" fill="#ddd6fe"/>
  <circle cx="90" cy="300" r="4" fill="#e9d5ff"/>
  <circle cx="330" cy="160" r="3" fill="#ede9fe"/>
</svg>
