<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer glow circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <!-- Head shape -->
  <rect x="14" y="18" width="36" height="30" rx="10" fill="#7c3aed"/>
  <!-- Visor / face area -->
  <rect x="18" y="24" width="28" height="16" rx="8" fill="#ede9fe"/>
  <!-- Left eye -->
  <circle cx="26" cy="32" r="4" fill="#7c3aed"/>
  <circle cx="27" cy="31" r="1.5" fill="white"/>
  <!-- Right eye -->
  <circle cx="38" cy="32" r="4" fill="#7c3aed"/>
  <circle cx="39" cy="31" r="1.5" fill="white"/>
  <!-- Mouth / speaker grille -->
  <line x1="27" y1="43" x2="37" y2="43" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="46" x2="35" y2="46" stroke="#ddd6fe" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="32" y1="18" x2="32" y2="10" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="8" r="3.5" fill="#a78bfa"/>
  <circle cx="32" cy="8" r="1.5" fill="#f3e8ff"/>
  <!-- Ear pieces -->
  <rect x="8" y="28" width="6" height="12" rx="3" fill="#a78bfa"/>
  <rect x="50" y="28" width="6" height="12" rx="3" fill="#a78bfa"/>
  <defs>
    <linearGradient id="bg" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0c3fc"/>
      <stop offset="1" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
</svg>
